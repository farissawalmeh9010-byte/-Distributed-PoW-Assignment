
syntax = "proto3";

package pow;

option go_package = "distributed-pow/gen/pow;powpb";

// Coordinator service: workers register and send heartbeats.
service CoordinatorService {
  rpc RegisterWorker(RegisterWorkerRequest)
      returns (RegisterWorkerResponse);

  rpc Heartbeat(HeartbeatRequest)
      returns (HeartbeatResponse);
}

// Worker service: coordinator assigns search ranges.
service WorkerService {
  rpc Search(SearchRequest)
      returns (stream SearchUpdate);
}

message RegisterWorkerRequest {
  string worker_id = 1;
  string address = 2;
}

message RegisterWorkerResponse {
  bool success = 1;
  string message = 2;
}

message HeartbeatRequest {
  string worker_id = 1;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

message SearchRequest {
  string job_id = 1;
  string data = 2;
  int32 difficulty = 3;
  uint64 start_nonce = 4;
  uint64 end_nonce = 5;
}

message SearchUpdate {
  string worker_id = 1;
  string job_id = 2;

  uint64 checked = 3;
  uint64 current_nonce = 4;

  bool found = 5;
  uint64 nonce = 6;
  string hash = 7;

  bool completed = 8;
  string message = 9;
}
